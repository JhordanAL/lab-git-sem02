<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aroma - Contacto</title>
</head>

    <h1>Contáctanos — Versión A</h1>

<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f1ea; color: #333;">

    <!-- Menú de navegación -->
    <nav style="background-color: #4a2c2a; padding: 15px; text-align: center; border-radius: 5px;">
        <a href="index.html" style="color: #d4a373; text-decoration: none; margin: 0 15px; font-weight: bold;">Inicio</a> |
        <a href="about.html" style="color: #d4a373; text-decoration: none; margin: 0 15px; font-weight: bold;">Nosotros</a> |
        <a href="contact.html" style="color: #ffffff; text-decoration: none; margin: 0 15px; font-weight: bold;">Contacto</a>
    </nav>

    <!-- Contenido Principal -->
    <main style="max-width: 800px; margin: 20px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h1 style="color: #4a2c2a; text-align: center;">Contáctanos</h1>
        <p style="text-align: center;">¿Tienes alguna consulta o sugerencia? Escríbenos un mensaje.</p>
        
        <form style="display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto;">
            <label style="font-weight: bold;">Nombre:
                <input type="text" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </label>
            <label style="font-weight: bold;">Correo Electrónico:
                <input type="email" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </label>
            <label style="font-weight: bold;">Mensaje:
                <textarea rows="4" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
            </label>
            <button type="submit" style="background-color: #4a2c2a; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 1em;">Enviar</button>
        </form>
    </main>

    <!-- Pie de página -->
    <footer style="text-align: center; margin-top: 20px; color: #777; font-size: 0.9em;">
        <p>&copy; 2026 Café Aroma - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
